<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rotation LLM gateway</title><meta name="theme-color" content="#050505"><style>body{margin:0;background:#050505;color:#F4F4F8;font-family:-apple-system,sans-serif}main{max-width:480px;margin:0 auto;padding:20px}textarea,input{width:100%;background:#0d0d11;border:1px solid #1f1f28;border-radius:12px;color:inherit;padding:12px}button{margin-top:10px;border:0;border-radius:999px;padding:12px 16px;background:#00F2FE;color:#041418;font-weight:800}pre{white-space:pre-wrap;background:#0d0d11;border:1px solid #1f1f28;border-radius:12px;padding:12px;font-size:.8rem}a{color:#00F2FE}.hint{color:#8B8B9A}</style></head><body><main><p class="hint">RotationTV Network LLC · Deno gateway · not Express</p><h1>Studio query</h1><input id="base" placeholder="API base (Deno URL)"><input id="key" placeholder="LLM_GATEWAY_KEY" style="margin-top:8px"><textarea id="prompt" rows="6" style="margin-top:8px">Write a first-party Rotation Live room brief.</textarea><button id="go">POST /api/query</button><pre id="out">Set API base, then run.</pre><p><a href="live.html">Live</a></p></main><script src="api-config.js"></script><script>const baseEl=document.getElementById("base");baseEl.value=window.__ROTATION_API_BASE_URL__||localStorage.getItem("rotationApi")||"";document.getElementById("go").onclick=async()=>{const base=baseEl.value.replace(/\/$/,"");localStorage.setItem("rotationApi",base);const headers={"Content-Type":"application/json"};const key=document.getElementById("key").value.trim();if(key)headers.Authorization="Bearer "+key;const out=document.getElementById("out");out.textContent="…";try{const res=await fetch(base+"/api/query",{method:"POST",headers,body:JSON.stringify({prompt:document.getElementById("prompt").value,preferredProvider:"xai"})});out.textContent=await res.text();}catch(err){out.textContent=String(err);}};</script></body></html>
